name: Validar eventos

# Corre en cada PR y en cada push. Si falla, el archivo no se publica y las
# TV siguen con la última versión buena.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    name: Formato y reglas de eventos.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pruebas del validador
        run: cd tools && python3 -m unittest -v test_validar_eventos
      - name: Validar eventos.json
        run: python3 tools/validar_eventos.py eventos.json
      - name: Los PR semanales sólo tocan eventos.json e imagenes/biblioteca/
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'eventos/')
        shell: bash
        run: |
          set -euo pipefail
          otros=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -vE '^(eventos\.json|imagenes/biblioteca/[a-z0-9][a-z0-9_-]*\.(jpg|jpeg|png|webp))$' || true)
          if [ -n "$otros" ]; then
            echo "::error::Un PR de eventos sólo puede cambiar eventos.json e imagenes/biblioteca/. También cambia: $otros"
            exit 1
          fi
